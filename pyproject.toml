[project]
name = "codeforge-harness"
version = "0.1.0"
description = "MCP-native production agent harness that governs coding-agent tool execution"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2.9,<3",
    "typer>=0.15,<0.17",
    "httpx>=0.27,<0.29",
    "rich>=13.9,<15",
    "PyYAML>=6,<7",
    "anyio>=4.6,<5",
]

[project.scripts]
codeforge = "codeforge_harness.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "types-PyYAML>=6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["codeforge_harness"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
